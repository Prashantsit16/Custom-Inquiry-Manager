{% extends "base.html" %}

{% block content %}

<h1>Inquiry Dashboard</h1>

<table border="1" cellpadding="10">

<tr>

<th>Name</th>
<th>Email</th>
<th>Subject</th>

</tr>

{% for inquiry in inquiries %}

<tr>

<td>
    <a href="/inquiry/{{ loop.index0 }}">
        {{ inquiry.name }}
    </a>
</td>

<td>{{ inquiry.email }}</td>

<td>{{ inquiry.subject }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
